<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extensión</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js" defer></script>
    <script src="src/extension.js" defer></script> 
</head>
<body>
    <navbar>
        <a href="informeLabores.html"><button>Volver</button></a>
    </navbar>
    <main>
        <section>
            <form id="frmRegistrarExtension">
                <label for="nProfesor">Nombre del profesor:</label>
                <select name="nProfesor" id="nProfesor" required></select>
                <br>
                <label for="tipo">Tipo de actividad:</label>
                <select name="tipo" id="tipo" required>
                    <option value="Charla">Charla</option>
                    <option value="Proyecto">Proyecto</option>
                    <option value="Seminario">Seminario</option>
                </select>
                <br>
                <label for="nActividad">Nombre de la actividad:</label>
                <input type="text" name="nActividad" id="nActividad" required>
                <br>
                <label for="tituloP">Título de la participación</label>
                <select name="tituloP" id="tituloP" required>
                    <option value="Ponente">Ponente</option>
                    <option value="Asistente">Asistente</option>
                </select>
                <br>
                <label for="fecha">Fecha:</label>
                <input type="date" name="fecha" id="fecha" required>
                <br>
                <label for="lugar">Lugar:</label>
                <input type="text" name="lugar" id="lugar" required>
                <br>
                <label for="tipoP">Tipo de participación:</label>
                <select name="tipoP" id="tipoP" required>
                    <option value="Ponente">Ponente</option>
                    <option value="Charlista">Charlista</option>
                </select>
                <br>
                <label for="organizadores">Organizadores:</label>
                <input type="text" name="organizadores" id="organizadores" required>
                <br>
                <label for="otraInfo">Otra información:</label>
                <textarea name="otraInfo" id="otraInfo" cols="45" rows="10"></textarea>
                <br>
                <button type="submit">Registar actividad</button>
            </form>
        </section>
    </main>
</body>
</html>
