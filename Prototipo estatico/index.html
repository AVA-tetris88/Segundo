<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesión</title>
    <script src="supabase.js"></script>
    <script src="src/static.js" defer></script>
</head>
<body>
    <div>
        <h1>Inicio de sesión</h1>
        <form>
            <label for="usuario">Nombre de usuario:</label>
            <input type="text" id="usuario" name="username" required>
            <br><br>
            <label for="contrasenna">Contraseña:</label>
            <input type="password" id="contrasenna" name="password" required>
        </form>
        <button id="btnIS" onclick="iniciarSesion()">Iniciar sesión</button>
    </div>
</body>
</html>
