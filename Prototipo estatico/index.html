<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesión</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js" defer></script>
    <script src="src/indexIS.js" defer></script>
</head>
<body>
        <div>
            <h1>Inicio de sesión</h1>
            <form id="frmInicioSesion">
                <label for="correo">Correo electrónico:</label>
                <input type="text" id="correo" name="username" required>
                <br><br>
                <label for="contrasenna">Contraseña:</label>
                <input type="password" id="contrasenna" name="password" required>
                <br><br>
                <button id="btnInicioSesion">Iniciar sesión</button>
            </form>
        </div>
</body>
</html>
