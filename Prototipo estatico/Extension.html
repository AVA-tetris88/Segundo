<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extensión</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js" defer></script>
    <script src="src/extension.js" defer></script> 
</head>
<body>
    <navbar>
        <a href="InformeSemestral.html">Informe Semestral</a>
    </navbar>
    <main>
        <section>
            <form id="frmRegistrarActividad">
                <label for="nProfesor">Nombre del profesor:</label>
                <input name="nProfesor" id="nProfesor" required>
                </input>
                <br>
                <label for="tipo">Tipo de actividad:</label>
                <select name="tipo" id="tipo" required>
                    <option value="actividad1">Charla</option>
                    <option value="actividad2">Proyecto</option>
                    <option value="actividad3">Seminario</option>
                </select>
                <br>
                <label for="nActividad">Nombre de la actividad:</label>
                <input type="text" name="nActividad" id="nActividad" required>
                <br>
                <label for="tituloP">Título de la participación</label>
                <select name="tituloP" id="tituloP" required>
                    <option value="participacion1">Ponente</option>
                    <option value="participacion2">Asistente</option>
                </select>
                <br>
                <label for="fecha">Fecha:</label>
                <input type="date" name="fecha" id="fecha" required>
                <br>
                <label for="lugar">Lugar:</label>
                <input type="text" name="lugar" id="lugar" required>
                <br>
                <label for="tipoP">Tipo de participación:</label>
                <select name="tipoP" id="tipoP" required>
                    <option value="participacion1">Ponente</option>
                    <option value="participacion2">Charlista</option>
                </select>
                <br>
                <label for="organizadores">Organizadores:</label>
                <input type="text" name="organizadores" id="organizadores" required>
                <br>
                <label for="otraInfo">Otra información:</label>
                <textarea name="otraInfo" id="otraInfo" cols="30" rows="5"></textarea>
                <br>
                <button type="submit" id="btnRegistrarActividad">Registar actividad</button>
            </form>
        </section>
    </main>
</body>
</html>
